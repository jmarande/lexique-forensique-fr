name: Synchroniser tableau forensique

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/project-sync.yml']

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Synchroniser ajouts et priorites
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            const token = process.env.PROJECT_TOKEN;
            if (!token) {
              core.setFailed('PROJECT_SYNC_TOKEN absent : configurer le secret avant activation.');
              return;
            }
            const owner = 'jmarande';
            const projectNumber = 1;
            const query = `query($login: String!, $number: Int!) {
              user(login: $login) {
                projectV2(number: $number) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }`;
            const project = (await github.graphql(query, { login: owner, number: projectNumber })).user?.projectV2;
            if (!project) {
              core.setFailed('Projet GitHub introuvable ou token sans accès Projects.');
              return;
            }
            const priorityField = project.fields.nodes.find(field => field?.name === 'Priority');
            if (!priorityField) {
              core.setFailed('Champ Priority introuvable dans le Project.');
              return;
            }
            // Daily and manual runs reconcile both repositories; event runs only the changed item.
            const fullSync = ['workflow_dispatch', 'schedule', 'push'].includes(context.eventName);
            const items = [];
            if (fullSync) {
              for (const repository of ['CONSTATBOX-V5', 'lexique-forensique-fr']) {
                const found = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo: repository, state: 'open', per_page: 100
                });
                items.push(...found);
              }
            } else {
              const changed = context.payload.issue ?? context.payload.pull_request;
              if (changed && changed.state === 'open') items.push(changed);
            }
            core.info(`Éléments ouverts à synchroniser : ${items.length}`);
            let addedCount = 0, priorityCount = 0, withoutPriority = 0;
            for (const item of items) {
              const priorityLabels = (item.labels || []).map(label => label.name || '').join(' ');
              const match = (priorityLabels + ' ' + (item.title || '')).match(/(?:^|[^A-Z0-9])P([012])(?:$|[^A-Z0-9])/i);
              const desired = match ? `P${match[1]}` : null;
              const nodeId = item.node_id;
            const addMutation = `mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }`;
              const added = await github.graphql(addMutation, { project: project.id, content: nodeId });
              const projectItemId = added.addProjectV2ItemById.item.id;
              addedCount++;
              if (!desired) withoutPriority++;
            }
            core.info(`Terminé : ${addedCount} éléments examinés, ${priorityCount} priorités explicites synchronisées, ${withoutPriority} priorités préservées.`);

            // Corriger toutes les cartes du tableau, y compris fermées et brouillons.
            // Ne jamais écraser une priorité déjà renseignée.
            let after = null;
            let inspected = 0;
            let corrected = 0;
            do {
              const projectPage = await github.graphql(
                'query($id: ID!, $after: String) { node(id: $id) { ... on ProjectV2 { items(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { id content { ... on Issue { title labels(first: 50) { nodes { name } } } ... on PullRequest { title labels(first: 50) { nodes { name } } } ... on DraftIssue { title } } fieldValues(first: 50) { nodes { ... on ProjectV2ItemFieldSingleSelectValue { field { ... on ProjectV2SingleSelectField { id } } optionId } } } } } } } }',
                { id: project.id, after }
              );
              const page = projectPage.node.items;
              for (const card of page.nodes) {
                inspected++;
                const existing = card.fieldValues.nodes.find(value =>
                  value?.field?.id === priorityField.id && value.optionId
                );
                if (existing) continue;
                const labels = (card.content?.labels?.nodes || []).map(label => label.name).join(' ');
                const title = card.content?.title || '';
                const matched = (labels + ' ' + title).match(/(?:^|[^A-Z0-9])P([012])(?:$|[^A-Z0-9])/i);
                const level = matched ? 'P' + matched[1] : 'P2';
                const option = priorityField.options.find(value =>
                  value.name === level || value.name.startsWith(level + ' ')
                );
                if (!option) {
                  core.setFailed('Option Priority introuvable : ' + level);
                  return;
                }
                await github.graphql(
                  'mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) { updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) { projectV2Item { id } } }',
                  { project: project.id, item: card.id, field: priorityField.id, option: option.id }
                );
                corrected++;
              }
              after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (after);
            core.info('Cartes du tableau vérifiées : ' + inspected + ', priorités manquantes renseignées : ' + corrected);
            // Les statuts et toutes les priorités existantes sont conservés.
