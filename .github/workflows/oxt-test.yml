name: Construire OXT de test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oxt-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérification de la syntaxe Python
        run: python -m compileall -q extension/Scripts/python scripts/generate_fiches.py
      - name: Validation de la synchronisation et des fiches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=Path("data/lexique.json").read_bytes()
          assert data==Path("extension/data/lexique.json").read_bytes(), "Bases JSON non synchronisées"
          terms=json.loads(data)
          taxonomy=json.loads(Path("data/taxonomie-proposition.json").read_text(encoding="utf-8"))
          assert {x["id"] for x in terms}=={x["id"] for x in taxonomy["classement"]}
          print("63 fiches et classification contrôlées")
          PY
          python scripts/generate_fiches.py
          python scripts/generate_fiches.py --check
      - name: Construire l'extension de test
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          src=Path("extension")
          # Préversion d'essai: version dans l'archive seulement, jamais dans main.
          script=src/"Scripts/python/lexique_forensique.py"
          content=script.read_text(encoding="utf-8")
          content,count=re.subn(r'^CURRENT_VERSION = "[^"]+"$', 'CURRENT_VERSION = "0.8.2"', content, count=1, flags=re.M)
          assert count==1
          script.write_text(content,encoding="utf-8")
          xml=src/"description.xml"
          content,count=re.subn(r'<version value="[^"]+"\s*/>', '<version value="0.8.2"/>', xml.read_text(encoding="utf-8"),count=1)
          assert count==1
          xml.write_text(content,encoding="utf-8")
          with ZipFile("lexique-forensique-fr-test-0.8.2.oxt","w",ZIP_DEFLATED) as archive:
              for file in src.rglob("*"):
                  if file.is_file() and "__pycache__" not in file.parts:
                      archive.write(file,file.relative_to(src).as_posix())
          print("OXT de test construit")
          PY
      - name: Publier l'artefact pour installation
        uses: actions/upload-artifact@v4
        with:
          name: lexique-forensique-fr-test-0.8.2
          path: lexique-forensique-fr-test-0.8.2.oxt
          retention-days: 14
