name: Catalogue des fiches Markdown
on:
  push:
    branches: [main]
    paths:
      - 'data/lexique.json'
      - 'scripts/generate_fiches.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_fiches.py
      - name: Publier les fiches générées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiches/
          if ! git diff --cached --quiet; then
            git commit -m "docs: synchroniser les fiches du lexique"
            git push
          fi
